[package]
name = "aoraki-cli"
version = "0.1.0"
edition = "2021"
description = "Aoraki — Heroku-style deploys straight to your servers"
license = "MIT"

[[bin]]
name = "aoraki"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
