# Release builds: push a tag like v0.1.0 and this attaches prebuilt
# binaries to the GitHub Release. install.sh (docs/) downloads whichever
# asset matches the user's OS/arch.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          # cross-compiled on the arm64 runner — macos-13 (Intel) runners
          # are deprecated and queue indefinitely
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf aoraki-${{ matrix.target }}.tar.gz aoraki
          shasum -a 256 aoraki-${{ matrix.target }}.tar.gz > aoraki-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/aoraki-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/aoraki-${{ matrix.target }}.tar.gz.sha256
